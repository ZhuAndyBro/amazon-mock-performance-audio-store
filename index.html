}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

      &lt;div class=&quot;pas-production-head&quot;&gt;&lt;div&gt;&lt;span class=&quot;pas-eyebrow&quot;&gt;STOREFRONT → FACTORY / 店铺结构 → 工厂执行&lt;/span&gt;&lt;h2&gt;Amp Wiring Kit BOM &amp;amp; Production Product Map&lt;/h2&gt;&lt;p class=&quot;pas-lead&quot;&gt;功放安装套装BOM与生产产品地图 · Store categories are translated into shared manufacturing modules, launch SKUs and later-stage gaps.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;pas-status-legend&quot;&gt;&lt;span class=&quot;is-p0&quot;&gt;P0 首发&lt;/span&gt;&lt;span class=&quot;is-p1&quot;&gt;P1 扩展&lt;/span&gt;&lt;span class=&quot;is-p2&quot;&gt;P2 后续&lt;/span&gt;&lt;span class=&quot;is-buy&quot;&gt;外购/协作&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;div class=&quot;pas-production-alert&quot;&gt;&lt;strong&gt;Production rule / 生产规则&lt;/strong&gt;&lt;span&gt;前台类目用于表达“完整系统”；工厂只按照本生产地图下单。第一阶段线缆导体采用OFC。6声道配置由4CH RCA＋2CH RCA组成，不开发独立6CH RCA。&lt;/span&gt;&lt;/div&gt;

      &lt;div class=&quot;pas-production-kpis&quot;&gt;&lt;div&gt;&lt;b&gt;9&lt;/b&gt;&lt;span&gt;Storefront categories&lt;br&gt;前台主类目&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;6&lt;/b&gt;&lt;span&gt;Shared BOM families&lt;br&gt;共享零件族&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;4&lt;/b&gt;&lt;span&gt;P0 launch kits&lt;br&gt;首发套装&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;2&lt;/b&gt;&lt;span&gt;Core conductor platforms&lt;br&gt;OFC供电＋信号&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;div class=&quot;pas-production-tabs&quot; role=&quot;group&quot; aria-label=&quot;Production map filters&quot;&gt;&lt;button type=&quot;button&quot; data-prod-filter=&quot;all&quot; aria-pressed=&quot;true&quot;&gt;All / 全部&lt;/button&gt;&lt;button type=&quot;button&quot; data-prod-filter=&quot;p0&quot; aria-pressed=&quot;false&quot;&gt;P0 Launch / 首发&lt;/button&gt;&lt;button type=&quot;button&quot; data-prod-filter=&quot;p1&quot; aria-pressed=&quot;false&quot;&gt;P1 Extension / 扩展&lt;/button&gt;&lt;button type=&quot;button&quot; data-prod-filter=&quot;modules&quot; aria-pressed=&quot;false&quot;&gt;Shared Modules / 共享零件&lt;/button&gt;&lt;button type=&quot;button&quot; data-prod-filter=&quot;gaps&quot; aria-pressed=&quot;false&quot;&gt;Gaps / 缺口&lt;/button&gt;&lt;/div&gt;

      &lt;div class=&quot;pas-prod-panels&quot;&gt;
        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;p0 p1&quot;&gt;
          &lt;h3&gt;1. Kit platform BOM / 套装平台BOM&lt;/h3&gt;
          &lt;div class=&quot;pas-table-wrap&quot;&gt;&lt;table class=&quot;pas-bom-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Platform&lt;br&gt;平台&lt;/th&gt;&lt;th&gt;Main power&lt;br&gt;主电源线&lt;/th&gt;&lt;th&gt;Ground&lt;br&gt;接地线&lt;/th&gt;&lt;th&gt;Remote&lt;/th&gt;&lt;th&gt;Speaker wire&lt;br&gt;喇叭线&lt;/th&gt;&lt;th&gt;Main protection&lt;br&gt;主保护&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;&lt;strong&gt;8 AWG OFC&lt;/strong&gt;&lt;span class=&quot;pas-badge is-p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;td&gt;17 ft · blue/red&lt;/td&gt;&lt;td&gt;3 ft · black&lt;/td&gt;&lt;td&gt;17 ft · 18 AWG&lt;/td&gt;&lt;td&gt;20 ft · 16 AWG&lt;/td&gt;&lt;td&gt;Mini-ANL/ANL holder + 60A&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;strong&gt;4 AWG OFC&lt;/strong&gt;&lt;span class=&quot;pas-badge is-p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;td&gt;17 ft · blue/red&lt;/td&gt;&lt;td&gt;3 ft · black&lt;/td&gt;&lt;td&gt;17 ft · 18 AWG&lt;/td&gt;&lt;td&gt;20 ft · 16 AWG&lt;br&gt;&lt;small&gt;5/6CH length to verify&lt;/small&gt;&lt;/td&gt;&lt;td&gt;Mini-ANL/ANL holder + 100A&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;strong&gt;1/0 AWG OFC&lt;/strong&gt;&lt;span class=&quot;pas-badge is-p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;td&gt;17 ft · blue/red&lt;/td&gt;&lt;td&gt;3 ft · black&lt;/td&gt;&lt;td&gt;17 ft · 18 AWG&lt;/td&gt;&lt;td&gt;20 ft · 12 AWG&lt;/td&gt;&lt;td&gt;ANL holder + 300A&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;&lt;strong&gt;1/0 Dual-Amp&lt;/strong&gt;&lt;span class=&quot;pas-badge is-p1&quot;&gt;P1&lt;/span&gt;&lt;/td&gt;&lt;td&gt;17 ft 1/0 + 5 ft 4 AWG branch&lt;/td&gt;&lt;td&gt;3 ft 1/0 + 5 ft 4 AWG branch&lt;/td&gt;&lt;td&gt;17 ft · 18 AWG&lt;/td&gt;&lt;td&gt;Complete: 50–60 ft · 12/14 AWG&lt;/td&gt;&lt;td&gt;300A main + fused positive distribution&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
          &lt;p class=&quot;pas-table-note&quot;&gt;Lengths are derived from the current benchmark BOM and remain engineering inputs—not final claims. Cable resistance, voltage drop, temperature rise and fuse coordination must be validated before mass production.&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;p0 p1&quot;&gt;
          &lt;h3&gt;2. Channel configuration = add-on BOM / 声道配置＝增加件&lt;/h3&gt;
          &lt;div class=&quot;pas-channel-grid&quot;&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p1&quot;&gt;Power-only&lt;/span&gt;&lt;strong&gt;Base power platform&lt;/strong&gt;&lt;p&gt;不增加RCA；保留电源、接地、Remote、喇叭线及安装辅料。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p0&quot;&gt;2CH Complete&lt;/span&gt;&lt;strong&gt;+ 2CH RCA · 5 m ×1&lt;/strong&gt;&lt;p&gt;8 / 4 / 1/0 AWG共享同一2声道RCA模块。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p0&quot;&gt;4CH Complete&lt;/span&gt;&lt;strong&gt;+ 4CH RCA · 5 m ×1&lt;/strong&gt;&lt;p&gt;首发重点为4 AWG；其他线径按需求扩展。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p1&quot;&gt;5/6CH Complete&lt;/span&gt;&lt;strong&gt;+ 4CH RCA ×1 + 2CH RCA ×1&lt;/strong&gt;&lt;p&gt;不开发独立6CH RCA，降低模具、采购与库存复杂度。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p1&quot;&gt;Dual-Amp Power&lt;/span&gt;&lt;strong&gt;Power distribution only&lt;/strong&gt;&lt;p&gt;1/0主线、两组4 AWG支路、正极保险分配与接地分配。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p1&quot;&gt;Dual-Amp Complete&lt;/span&gt;&lt;strong&gt;+ 4CH RCA + 2CH RCA + 50–60 ft speaker wire&lt;/strong&gt;&lt;p&gt;面向单声道低音功放＋四声道全频功放。&lt;/p&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;p0&quot;&gt;
          &lt;h3&gt;3. P0 launch SKU / 第一阶段首发SKU&lt;/h3&gt;
          &lt;div class=&quot;pas-launch-grid&quot;&gt;&lt;article&gt;&lt;span&gt;SKU 01&lt;/span&gt;&lt;strong&gt;8 AWG 2CH Complete&lt;/strong&gt;&lt;small&gt;入门流量款 · 600W class&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;SKU 02&lt;/span&gt;&lt;strong&gt;4 AWG 2CH Complete&lt;/strong&gt;&lt;small&gt;主流核心款 · 600–1,500W class&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;SKU 03&lt;/span&gt;&lt;strong&gt;4 AWG 4CH Complete&lt;/strong&gt;&lt;small&gt;全车扬声器系统&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;SKU 04&lt;/span&gt;&lt;strong&gt;1/0 AWG 2CH Complete&lt;/strong&gt;&lt;small&gt;高功率核心款 · 1,500–3,000W class&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;p1&quot;&gt;
          &lt;h3&gt;4. P1 extension SKU / 第一阶段扩展SKU&lt;/h3&gt;
          &lt;div class=&quot;pas-launch-grid p1&quot;&gt;&lt;article&gt;&lt;strong&gt;8 / 4 / 1/0 Power-only&lt;/strong&gt;&lt;small&gt;共享基础BOM，去掉RCA&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;strong&gt;4 AWG 5/6CH Complete&lt;/strong&gt;&lt;small&gt;4CH＋2CH RCA组合&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;strong&gt;1/0 Dual-Amp Power&lt;/strong&gt;&lt;small&gt;专业安装用户&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;strong&gt;1/0 Dual-Amp Complete&lt;/strong&gt;&lt;small&gt;完整双功放系统&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;modules&quot;&gt;
          &lt;h3&gt;5. Shared manufacturing modules / 六大共享生产模块&lt;/h3&gt;
          &lt;div class=&quot;pas-module-grid&quot;&gt;
            &lt;article&gt;&lt;b&gt;A&lt;/b&gt;&lt;div&gt;&lt;strong&gt;High-current cable / 大电流线材&lt;/strong&gt;&lt;p&gt;8 AWG、4 AWG、1/0 AWG OFC电源线（蓝/红）与接地线（黑）。&lt;/p&gt;&lt;span class=&quot;pas-owner make&quot;&gt;建议自产核心&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
            &lt;article&gt;&lt;b&gt;B&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Signal &amp;amp; speaker / 信号与喇叭线&lt;/strong&gt;&lt;p&gt;18 AWG Remote；16 / 14 / 12 AWG喇叭线；2CH与4CH RCA 5 m。&lt;/p&gt;&lt;span class=&quot;pas-owner make&quot;&gt;自产／验证&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
            &lt;article&gt;&lt;b&gt;C&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Protection &amp;amp; distribution / 保护与分配&lt;/strong&gt;&lt;p&gt;ANL、Mini-ANL保险座和保险片；保险正极分线器；非保险接地分线器。&lt;/p&gt;&lt;span class=&quot;pas-owner buy&quot;&gt;建议首期外购标件&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
            &lt;article&gt;&lt;b&gt;D&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Terminals / 端子连接&lt;/strong&gt;&lt;p&gt;8 / 4 / 1/0 AWG大线端子；12 / 16 / 18 AWG叉形、快接与对接端子。&lt;/p&gt;&lt;span class=&quot;pas-owner buy&quot;&gt;外购＋来料验证&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
            &lt;article&gt;&lt;b&gt;E&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Installation materials / 安装辅料&lt;/strong&gt;&lt;p&gt;防火墙胶圈、热缩管、扎带、尼龙保护编织网。&lt;/p&gt;&lt;span class=&quot;pas-owner buy&quot;&gt;外购标件&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
            &lt;article&gt;&lt;b&gt;F&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Packaging &amp;amp; content / 包装与内容&lt;/strong&gt;&lt;p&gt;平台包装、声道标签、接线说明、Front/Rear/Sub识别标签。&lt;/p&gt;&lt;span class=&quot;pas-owner make&quot;&gt;自有设计＋协作生产&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;modules&quot;&gt;
          &lt;h3&gt;6. Correct Dual-Amp distribution architecture / 双功放分配器修正&lt;/h3&gt;
          &lt;div class=&quot;pas-flow-grid&quot;&gt;&lt;div&gt;&lt;strong&gt;Positive / 正极&lt;/strong&gt;&lt;p&gt;Battery → 300A main fuse → 1/0 AWG → &lt;em&gt;fused distribution block&lt;/em&gt; → two 4 AWG amplifier branches&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Ground / 负极&lt;/strong&gt;&lt;p&gt;Two 4 AWG amplifier grounds → &lt;em&gt;non-fused ground block&lt;/em&gt; → 1/0 AWG → chassis ground&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;p class=&quot;pas-table-note warning&quot;&gt;现有基准BOM把两个分线器写成同一项，不足以指导生产。建议开发共用外壳平台，但正极版必须具备独立支路保险，接地版不装保险。&lt;/p&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;gaps&quot;&gt;
          &lt;h3&gt;7. Storefront-to-BOM gap register / 前台目录与现有BOM缺口&lt;/h3&gt;
          &lt;div class=&quot;pas-gap-list&quot;&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p1&quot;&gt;Clarify&lt;/span&gt;&lt;strong&gt;6-Channel RCA&lt;/strong&gt;&lt;p&gt;作为前台选购入口保留；生产上用4CH＋2CH组合，不做独立线缆。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p1&quot;&gt;Validate&lt;/span&gt;&lt;strong&gt;14 AWG speaker wire&lt;/strong&gt;&lt;p&gt;Dual-Amp Complete可在12/14 AWG中选型，需样车布线和成本验证。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p2&quot;&gt;P2&lt;/span&gt;&lt;strong&gt;Big 3, battery terminals &amp;amp; bulk ground&lt;/strong&gt;&lt;p&gt;属于完整电气升级目录，但不在四款P0套装的必需BOM中。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p2&quot;&gt;P2&lt;/span&gt;&lt;strong&gt;Y-adapters, noise reduction &amp;amp; circuit breakers&lt;/strong&gt;&lt;p&gt;当前BOM没有定义规格、测试或供应商，不能直接进入采购清单。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-buy&quot;&gt;Partner&lt;/span&gt;&lt;strong&gt;Amplifiers, speakers &amp;amp; subwoofers&lt;/strong&gt;&lt;p&gt;前期由合作工厂生产；必须单独建立电声规格、可靠性和售后标准。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;span class=&quot;pas-badge is-p2&quot;&gt;Content&lt;/span&gt;&lt;strong&gt;Learn &amp;amp; Choose&lt;/strong&gt;&lt;p&gt;属于内容资产，不是物料；由工程验证数据生成线径、保险与接线指南。&lt;/p&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;pas-prod-panel&quot; data-prod-group=&quot;gaps&quot;&gt;
          &lt;h3&gt;8. Mandatory engineering gates / 量产前必须关闭的验证项&lt;/h3&gt;
          &lt;ol class=&quot;pas-gates&quot;&gt;&lt;li&gt;以真实导体截面积、20°C直流电阻、线长和压降确定功率推荐，不复制竞品峰值W数。&lt;/li&gt;&lt;li&gt;验证60A、100A和300A保险座持续温升；“通用外壳”不代表全部电流等级自动通过。&lt;/li&gt;&lt;li&gt;建立OFC材质证明、来料抽检、端子压接拉力、耐腐蚀和绝缘耐磨标准。&lt;/li&gt;&lt;li&gt;确认4 AWG 5/6CH喇叭线究竟采用20 ft还是50–60 ft，样车验证后冻结BOM。&lt;/li&gt;&lt;li&gt;所有商品页、包装、拣货码区分2CH与4CH RCA，避免竞品目录中出现的错配问题。&lt;/li&gt;&lt;/ol&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;pas-section&quot; id=&quot;pas-builder&quot;&gt;
      &lt;h2&gt;Build your system&lt;/h2&gt;&lt;p class=&quot;pas-lead&quot;&gt;Match amplifier type and RMS power to an installation starting point.&lt;/p&gt;
      &lt;div class=&quot;pas-builder&quot;&gt;
        &lt;div class=&quot;pas-builder-controls&quot;&gt;
          &lt;label for=&quot;pas-system&quot;&gt;System configuration&lt;/label&gt;&lt;select id=&quot;pas-system&quot;&gt;&lt;option value=&quot;mono&quot;&gt;Single monoblock&lt;/option&gt;&lt;option value=&quot;four&quot;&gt;Four-channel&lt;/option&gt;&lt;option value=&quot;dual&quot;&gt;Dual-amplifier&lt;/option&gt;&lt;/select&gt;
          &lt;label for=&quot;pas-rms&quot;&gt;Total rated output&lt;/label&gt;&lt;select id=&quot;pas-rms&quot;&gt;&lt;option value=&quot;500&quot;&gt;Up to 600W RMS&lt;/option&gt;&lt;option value=&quot;1000&quot;&gt;600–1,500W RMS&lt;/option&gt;&lt;option value=&quot;2200&quot;&gt;1,500–3,000W RMS&lt;/option&gt;&lt;/select&gt;
          &lt;label for=&quot;pas-length&quot;&gt;Battery-to-amplifier cable length&lt;/label&gt;&lt;select id=&quot;pas-length&quot;&gt;&lt;option value=&quot;short&quot;&gt;Up to 12 ft&lt;/option&gt;&lt;option value=&quot;standard&quot; selected&gt;13–18 ft&lt;/option&gt;&lt;option value=&quot;long&quot;&gt;More than 18 ft&lt;/option&gt;&lt;/select&gt;
          &lt;div class=&quot;pas-result&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;pas-system-flow&quot; aria-label=&quot;System wiring path&quot;&gt;
          &lt;div class=&quot;pas-node&quot;&gt;&lt;i data-lucide=&quot;battery&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Battery&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;pas-arrow&quot;&gt;→&lt;/span&gt;
          &lt;div class=&quot;pas-node&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Fuse&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;pas-arrow&quot;&gt;→&lt;/span&gt;
          &lt;div class=&quot;pas-node&quot;&gt;&lt;i data-lucide=&quot;cable&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Power wire&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;pas-arrow&quot;&gt;→&lt;/span&gt;
          &lt;div class=&quot;pas-node&quot;&gt;&lt;i data-lucide=&quot;radio-tower&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Amplifier&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;pas-arrow&quot;&gt;→&lt;/span&gt;
          &lt;div class=&quot;pas-node&quot;&gt;&lt;i data-lucide=&quot;speaker&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Audio output&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;pas-section&quot; data-home-only&gt;
      &lt;h2&gt;Learn before you install&lt;/h2&gt;
      &lt;div class=&quot;pas-guidegrid&quot;&gt;
        &lt;div class=&quot;pas-guide&quot;&gt;&lt;i data-lucide=&quot;ruler&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;Find your wire gauge&lt;/strong&gt;&lt;span&gt;Balance RMS output, conductor material and cable length.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pas-guide&quot;&gt;&lt;i data-lucide=&quot;microscope&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;OFC vs. CCA&lt;/strong&gt;&lt;span&gt;Understand conductor construction before comparing price.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pas-guide&quot;&gt;&lt;i data-lucide=&quot;shield-alert&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;Match fuse protection&lt;/strong&gt;&lt;span&gt;Size protection around the cable and installation—not peak claims.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;pas-guide&quot;&gt;&lt;i data-lucide=&quot;network&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;strong&gt;Plan a dual-amp system&lt;/strong&gt;&lt;span&gt;See power distribution, signal routing and grounding architecture.&lt;/span&gt;&lt;/div&gt;
